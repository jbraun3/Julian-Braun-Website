name: Daily uptime check

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch: 

permissions:
  issues: write 

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check site
        run: node scripts/uptime.js
        env:
          SITE_URL: https://julian-braun-website.onrender.com
          GITHUB_TOKEN: ${{ github.token }} 
