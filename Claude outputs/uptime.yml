# Once a day, GitHub runs scripts/uptime.js, which checks the site and opens an issue if it's down.
name: Daily uptime check

on:
  schedule:
    - cron: "0 16 * * *" # 16:00 UTC = 8am Pacific (standard time)
  workflow_dispatch: # manual "Run workflow" button for testing

permissions:
  issues: write # lets the script open an issue

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check site
        run: node scripts/uptime.js
        env:
          SITE_URL: https://YOUR-DOMAIN-OR-SITE.onrender.com # ← change this
          GITHUB_TOKEN: ${{ github.token }} # provided automatically by GitHub
